# Copy to config.yaml and select filenames returned by `comfywrap models`.
# Keep local paths and model weights out of Git; config.yaml is ignored.

comfyui:
  host: 127.0.0.1
  port: 8188
  timeout_s: 600
  poll_interval_s: 0.5

paths:
  workflows: workflows
  zones: configs/zones
  prompts: configs/prompts
  jobs: configs/jobs
  output: outputs
  history: generation_history.jsonl
  # Optional: reuse sd-combinator-ext configs and lora_texts as-is.
  combinator_root: ""
  # Optional A1111 install. Models are linked/referenced in place; never copied.
  webui_root: ""
  # Optional ComfyUI tree for extra_model_paths.yaml and model links.
  comfyui_root: ""

# Optional paths for the separate local voice-cloning runtime.
voice_clone:
  python: .local/tts/venv/Scripts/python.exe
  model_dir: models/tts/dots.tts-soar

workflow:
  file: sdxl_txt2img.api.json
  # Leave empty to auto-detect bindings. Override with node_id.input_name.
  map: {}

generation:
  checkpoint: YOUR_SDXL_CHECKPOINT.safetensors
  positive: a ceramic teapot on a wooden table, soft window light
  negative: blurry, watermark
  steps: 28
  cfg: 5.0
  sampler: euler_ancestral
  scheduler: normal
  width: 1024
  height: 1024
  seed: 42
  batch_size: 1
  denoise: 1.0
  init_image: ""       # local path or existing ComfyUI input key
  filename_prefix: wrapper
  loras: []
  # full = MODEL + CLIP; model_only is useful for Flux-style graphs.
  lora_mode: full
  include_lora_tags: false

  # Optional Anima LLLite controls. Items are applied in list order.
  # `image` may be a preprocessed map, or a raw image when preprocess=canny.
  anima_lllite: []
  # anima_lllite:
  #   - image: C:/path/to/control.png
  #     model_patch: anima-lllite-depth-1.safetensors
  #     strength: 1.0
  #     start_percent: 0.0
  #     end_percent: 1.0
  #     preprocess: none
  #     canny_low: 0.4
  #     canny_high: 0.8

  hires:
    enable: false
    scale: 1.5
    steps: 0
    denoise: 0.45
    upscaler: latent
  adetailer:
    enable: false
    model: ""
    denoise: 0.4
    steps: 20
    cfg: 5.0
    guide_size: 512
  # A1111-style whole-picture inpaint (white mask = repaint via SetLatentNoiseMask).
  inpaint:
    enable: false
    image: ""        # init image; empty falls back to init_image
    mask: ""        # white-on-black mask (drawn in the WebUI Inpaint tab or --inpaint-mask)
    denoise: 0.75
    grow: 0         # mask expand, px
    blur: 4         # mask feather, px
    invert: false   # true = inpaint not masked

batch:
  random_count: 1
  batch_count: 1
  cooldown_s: 0
  skip_exists: true
  least_used_first: true
  sample_random_at: prep
  save_locally: true
  in_flight: 1

video:
  workflow: minimax_h3_i2v_loop.api.json
  r2v_workflow: minimax_h3_r2v_loop.api.json
  r2v_unet: minimax_h3_ref2va_pruned_int8_convrot.safetensors
  ref_recipe: ref_native     # ref_native, or installed ref_turbo4/ref_turbo8
  ref_steps: 20              # adjustable base quality; Turbo steps are fixed
  ref_video_audio: true      # use sound from reference videos; can be disabled in the UI
  ref_turbo4_lora: minimax_h3_ref2v_turbo_4step_v0.1_comfyui_bf16.safetensors
  ref_turbo8_lora: minimax_h3_ref2v_turbo_8step_v1.0_768p_comfyui_bf16.safetensors
  reference_prompt: ""      # describe the new scene/action
  swap_prompt: ""           # optional extra edit instructions
  text_prompt: ""
  head_swap_workflow: minimax_h3_head_swap.api.json
  head_swap_unet: minimax_h3_fl2va_pruned_w4a8_mixed.safetensors
  head_swap_lora: minimax_h3_head_swap_v1.0_r32.safetensors  # applied separately at runtime
  head_swap_strength: 1.0
  character_swap_workflow: minimax_h3_character_swap.api.json
  character_swap_unet: minimax_h3_ref2va_pruned_int8_convrot.safetensors
  character_swap_lora: minimax_h3_turbo_v4_step600_pruned_comfyui.safetensors
  character_swap_lora_strength: 1.0
  character_swap_vae: minimax_h3_video_vae_int8_convrot.safetensors
  character_swap_shift_video: 6
  character_swap_size_megapixels: 0.8
  swap_source_start: 0         # seconds in the original source clip
  swap_source_end: 3           # 0 uses the whole clip; overrides Frames in swap modes
  sam3_checkpoint: sam3.1_multiplex_fp16.safetensors  # models/checkpoints
  sam3_target: ""           # character swap: who SAM3 should replace
  mode: i2v                 # i2v, r2v, r2v_frames, headswap, charswap, t2v
  recipe: acc               # native, acc, or acc4 when the weight exists
  unet: minimax_h3_fl2va_pruned_w4a8_mixed.safetensors
  clip: qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors
  vae: minimax_h3_video_vae_fp16.safetensors
  audio_vae: minimax_h3_audio_vae_fp32.safetensors
  acc_file: MiniMax-H3-FL2VA-Acc-8Step.safetensors
  frames: 124
  fps: 24
  steps: 8
  sampler: euler
  scheduler: simple
  shift_video: 12
  shift_audio: 3
  width: 832
  height: 480
  size_megapixels: 0.52
  ref_image_size: match    # match or max
  loop: false
  crossfade_frames: 12
  save_latents: true    # SaveLatent (.latent) next to each video for the Upscale tab
  latent_upscale: false
  rtx_vsr: false

qwen_image:
  workflow: qwen_image_2_1.api.json
  unet: qwen_image_2.1-Q6_K.gguf
  clip: qwen3vl_8b_w4a8.safetensors
  vae: qwen_image_2.1_vae_bf16.safetensors
  steps: 25
  cfg: 1.0
  sampler: euler
  scheduler: simple
  width: 1024
  height: 1024
  resolution: 1024          # reference resize; 0 keeps each image, snapped to 32
  batch_size: 1
  seed: -1
  filename_prefix: qwen_image_2_1
  cache_device: auto        # auto, gpu, cpu, off
  cache_dtype: default      # default, int8, int4
  match_reference: true     # edit samples at the first image's size
  prompt: ""
  negative: ""
